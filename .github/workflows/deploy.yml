name: Yayın

# Every push to main (also the panel's commits) builds the site and publishes it on Cloudflare
# (qzendizayn.com, config in yayin/wrangler.toml). The old GitHub Pages address gets redirect pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://qzendizayn.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # npm ci rejects lockfiles generated on macOS (missing Linux-only optional deps)
      - run: npm install --no-audit --no-fund

      - run: npm run build

      - name: Cloudflare'e yayınla
        run: npx --yes wrangler@4.158.0 deploy -c yayin/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: node scripts/redirect-stubs.mjs

      - uses: actions/upload-pages-artifact@v4
        with:
          path: redirect

  redirect:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
